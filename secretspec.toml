#:schema https://secretspec.dev/schema/secretspec.schema.json
# The secrets this repository's scripts and checks read. Declare a new one with
# `secretspec add <NAME> --description "<purpose>"`, and read it with
# `secretspec run -- <command>` or `secretspec get <NAME>`. No value ever enters
# the repository. On a workstation, values come from the provider the owner's
# secretspec config names, the Keychain by default. The ci profile reads them
# from the job environment only.
# Reference: https://secretspec.dev/reference/configuration/

[project]
name = "seer"
revision = "1.0"

[profiles.default]
GH_TOKEN = { description = "GitHub token for the gh calls in scripts/; a gh login works without it", required = false }

[profiles.ci.defaults]
providers = ["env://"]

# The repository secrets seer's own workflows read: Draft Open, the dashboard,
# and the review-entry callers. The reusable review bodies read the secrets
# their callers pass in, which belong to the calling repository.
[profiles.ci]
RUNEWRIGHT_APP_ID = { description = "Runewright GitHub App id: Draft Open, the dashboard, and the review cascade mint its token" }
RUNEWRIGHT_APP_KEY = { description = "Runewright GitHub App private key, paired with RUNEWRIGHT_APP_ID" }
RUNEWRIGHT_GITHUB_TOKEN = { description = "Owner-minted token that posts the Cursor summon, because Cursor ignores bot-authored comments" }
RUNESEER_APP_ID = { description = "Runeseer GitHub App id for the correctness review" }
RUNESEER_APP_KEY = { description = "Runeseer GitHub App private key, paired with RUNESEER_APP_ID" }
CLAUDE_CODE_OAUTH_TOKEN = { description = "Claude Code login for the correctness review run" }
