name: Review Correctness Entry

# Thin caller: the lane's body lives in this repository. The caller owns
# the triggers, the concurrency, and the permissions. The controller
# invites the paid lane on the ready event and on each push to a ready
# pull request; the body's triage stands it down before any spend. Review
# labels force a round, while stage labels record settled work. Applying
# or removing a review label may cancel an active run; other label changes
# do not. The lane consumes labels with the workflow token when a round
# ends, and those removals emit no events, so a clean round never
# re-enters here.
# pull_request_target, deliberately: the caller executes from the base branch,
# so a pull request cannot rewrite the reviewer, the mirror, or the secret
# wiring that judges its own head. The body checks out the judged head
# explicitly and strips its instruction surfaces before the model reads it.
on:
    pull_request_target:
        types:
            - opened
            - reopened
            - synchronize
            - converted_to_draft
            - labeled
            - unlabeled
            - ready_for_review
            - edited

permissions:
    contents: read
    pull-requests: write
    issues: write
    id-token: write
    actions: read
    checks: read

concurrency:
    group: review-correctness-${{ github.event.pull_request.number }}
    cancel-in-progress: ${{ contains(fromJSON('["labeled", "unlabeled"]'), github.event.action) && contains(fromJSON('["review", "review:macroscope", "review:runeseer"]'), github.event.label.name) }}

jobs:
    # The ready event is the automatic review request. A queued ready event
    # may arrive after the pull request went back to draft, so readiness
    # re-reads the live pull request before the lane may start.
    release:
        if: github.event.action == 'ready_for_review' && github.event.pull_request.draft == false
        runs-on: ubuntu-latest
        timeout-minutes: 2
        permissions:
            contents: read
            pull-requests: read
            issues: read
        outputs:
            summoned: ${{ steps.live.outputs.summoned }}
        steps:
            - id: live
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  # pipefail plus the explicit failure exit keep an API error
                  # from reading as a ready pull request.
                  set -o pipefail
                  draft=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}" \
                      --jq '.draft') \
                      || { echo "could not read the live pull request; rerun the check"; exit 1; }
                  if [ "$draft" = "false" ]; then
                      echo "summoned=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "summoned=false" >> "$GITHUB_OUTPUT"
                      echo "the pull request went back to draft; the lane stands down."
                  fi

    # The controller runs on the ready event, on every push to a ready
    # pull request, and on the owner's review:runeseer label. Its triage
    # stands the paid lane down before any spend. skip:runeseer is checked
    # here as well, so the lane is never invoked and no runner is spent
    # standing it down; the mirror then records the skipped lane.
    review:
        needs: release
        if: '!cancelled() && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.draft == false && !contains(github.event.pull_request.labels.*.name, ''skip:runeseer'') && ((github.event.action == ''labeled'' && github.event.label.name == ''review:runeseer'') || github.event.action == ''synchronize'' || (github.event.action == ''ready_for_review'' && needs.release.outputs.summoned == ''true''))'
        # A pull request must not modify the reviewer that judges the same head.
        uses: runedeck/seer/.github/workflows/review-correctness.yaml@main
        secrets:
            RUNESEER_APP_ID: ${{ secrets.RUNESEER_APP_ID }}
            RUNESEER_APP_KEY: ${{ secrets.RUNESEER_APP_KEY }}
            CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

    # Mirrors the called lane's result under the stable check context the
    # rulesets require. Fail-closed: a head the lane did not judge reports
    # failure rather than skipping, because a skipped check satisfies a
    # required status check, and it runs for drafts too so a label applied
    # in draft can never leave a skipped-green check behind. When the lane
    # does not run, green requires that Runeseer's latest review on this
    # exact head is an approval: an approval a later review superseded
    # stays red, and no event class can redden or green a head past that
    # judgment.
    review-context:
        name: review/correctness
        needs: review
        if: always()
        runs-on: ubuntu-latest
        timeout-minutes: 2
        steps:
            - env:
                  GH_TOKEN: ${{ github.token }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
              run: |
                  set -o pipefail
                  # A red mirror names what it saw: the lane job, and the verdict
                  # when one exists for this head. A missing verdict marks a lane
                  # fault rather than a judgment, and each case states its retry.
                  verdict_comments() {
                      gh api --paginate "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments?per_page=100" \
                          --jq '[.[] | select(.user.login == "runeseer[bot]") | select(.body | contains("<!-- runeseer-verdict sha=" + env.HEAD_SHA + " base=" + env.BASE_SHA + " round="))]' \
                          | jq -s 'add // []'
                  }
                  latest_machine_verdict() {
                      verdict_comments | jq -r '
                          [.[]
                              | . as $comment
                              | try (.body | capture("round=(?<round>[0-9]+) verdict=(?<verdict>clean|findings)( restart=(?<restart>none|cursor|macroscope))?( generation=(?<generation>[0-9]+))? -->")) catch null
                              | select(. != null)
                              | {round: (.round | tonumber), verdict, restart: (.restart // "none"), updated_at: $comment.updated_at, id: $comment.id}]
                          | sort_by(.round, .updated_at, .id)
                          | last // {}
                          | "\(.verdict // ""):\(.restart // "")"'
                  }
                  # The ledger binds the verdict to (reviewed_sha, generation).
                  # A thread the ledger never saw, or a generation past the
                  # verdict's, stales the approval until a re-adjudication.
                  # A head without a ledger falls through to the review check.
                  ledger_state() {
                      ledger_id=$(gh api --paginate "repos/${{ github.repository }}/actions/artifacts?name=runeseer-ledger-pr${{ github.event.pull_request.number }}&per_page=100" \
                          --jq '[.artifacts[] | select(.expired == false)]' \
                          | jq -s -r 'add // [] | sort_by(.created_at) | reverse | .[0].id // empty') || return 1
                      [ -n "$ledger_id" ] || { echo "none"; return 0; }
                      gh api "repos/${{ github.repository }}/actions/artifacts/$ledger_id/zip" > "$RUNNER_TEMP/ledger.zip" || return 1
                      unzip -o "$RUNNER_TEMP/ledger.zip" runeseer-ledger.json -d "$RUNNER_TEMP/ledger" >/dev/null || return 1
                      ledger="$RUNNER_TEMP/ledger/runeseer-ledger.json"
                      [ "$(jq -r '.reviewed_sha' "$ledger")" = "$HEAD_SHA" ] || { echo "other-head"; return 0; }
                      thread_query='query($owner: String!, $repo: String!, $number: Int!, $endCursor: String) {
                          repository(owner: $owner, name: $repo) {
                              pullRequest(number: $number) {
                                  reviewThreads(first: 100, after: $endCursor) {
                                      pageInfo { hasNextPage endCursor }
                                      nodes { id }
                                  }
                              }
                          }
                      }'
                      gh api graphql --paginate -f query="$thread_query" \
                          -f owner="${GITHUB_REPOSITORY%/*}" -f repo="${GITHUB_REPOSITORY#*/}" \
                          -F number="${{ github.event.pull_request.number }}" \
                          --jq '[.data.repository.pullRequest.reviewThreads.nodes[].id]' \
                          | jq -s 'add // []' > "$RUNNER_TEMP/thread-ids.json" || return 1
                      late=$(jq --slurpfile live "$RUNNER_TEMP/thread-ids.json" \
                          '[.threads[].id] as $known | [$live[0][] | select(. as $id | $known | index($id) | not)] | length' "$ledger")
                      generation=$(jq -r '.generation' "$ledger")
                      verdict_generation=$(jq -r '.verdict.generation // ""' "$ledger")
                      if [ "$late" != "0" ]; then
                          echo "stale:late-thread"
                      elif [ -z "$verdict_generation" ]; then
                          echo "unjudged:$generation"
                      elif [ "$verdict_generation" != "$generation" ]; then
                          echo "stale:generation"
                      else
                          echo "bound:$generation"
                      fi
                  }
                  explain_lane_failure() {
                      conclusion="$1"
                      job_url=$(gh api --paginate "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?per_page=100" \
                          --jq '[.jobs[] | select(.name == "review / correctness")]' \
                          | jq -s -r 'add // [] | first // empty | .html_url // ""') || job_url=""
                      verdict_line=$(verdict_comments \
                          | jq -r 'last // empty | "\(.body | split("\n") | map(select(startswith("**"))) | first // (.body | split("\n") | first)) (\(.html_url))"') || verdict_line=""
                      echo "the lane concluded: $conclusion"
                      [ -n "$job_url" ] && echo "lane job: $job_url"
                      if [ -n "$verdict_line" ]; then
                          echo "latest verdict for this head: $verdict_line"
                          echo "push a fix and apply review:runeseer to start a new round"
                      else
                          echo "no verdict exists for this head: the lane faulted before judging; rerun this workflow or apply review:runeseer for a fresh round"
                      fi
                  }
                  # Read live overrides before the mirror decides. A failed
                  # label read must not read as an applied override.
                  labels=$(gh api --paginate "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/labels?per_page=100" \
                      --jq '[.[].name]' | jq -s -r 'add // [] | .[]') \
                      || { echo "could not read the live labels; rerun the check"; exit 1; }
                  # skip: means the lane is out of scope for this pull request,
                  # so it clears whatever else happened.
                  if printf '%s\n' "$labels" | grep -qx 'skip:runeseer'; then
                      echo "skip:runeseer present; this lane is out of scope for this pull request."
                      exit 0
                  fi
                  # ignore:runeseer cannot hide a failed current round. It can
                  # release only a prior judgment when no new round ran.
                  if [ "${{ needs.review.result }}" != "success" ] && [ "${{ needs.review.result }}" != "skipped" ]; then
                      explain_lane_failure "${{ needs.review.result }}"
                      exit 1
                  fi
                  # ignore: releases a judged lane, never a broken one. Every
                  # completed round posts exactly one summary whose first line
                  # carries the head it judged, and it posts that summary
                  # whether the verdict was clean or not, so it is the one
                  # signal present for any judgment and absent for a fault. A
                  # review is not: the lane emits one only when it comments
                  # inline or approves, so a round of carried or Low findings
                  # leaves none.
                  if printf '%s\n' "$labels" | grep -qx 'ignore:runeseer'; then
                      judged=$(verdict_comments | jq -r 'length') \
                          || { echo "could not read the pull request comments; rerun the check"; exit 1; }
                      if [ "$judged" != "0" ]; then
                          echo "ignore:runeseer present and this head carries a Runeseer verdict summary; the owner accepted its findings."
                          exit 0
                      fi
                      echo "ignore:runeseer present, but no Runeseer verdict exists for this head; a lane that never judged is broken, not ignored."
                      exit 1
                  fi
                  # A reusable workflow whose inner job skips its guard still
                  # concludes success, so a successful caller result defers to
                  # the inner job's own conclusion. A failed jobs read fails
                  # this check rather than falling through to the approval
                  # path, and an unknown conclusion stays red.
                  if [ "${{ needs.review.result }}" = "success" ]; then
                      inner=$(gh api --paginate "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?per_page=100" \
                          --jq '[.jobs[] | select(.name == "review / correctness")]' \
                          | jq -s -r 'add // [] | first | .conclusion // "missing"') \
                          || { echo "could not read this run's jobs; rerun the check"; exit 1; }
                      if [ "$inner" = "success" ]; then
                          echo "the lane judged this head or stood down in scope."
                          exit 0
                      fi
                      if [ "$inner" != "skipped" ]; then
                          explain_lane_failure "$inner"
                          exit 1
                      fi
                  fi
                  # Per-page jq output merges through jq -s: the runner's gh
                  # predates --slurp. pipefail keeps a failed reviews read from
                  # reading as an absent approval.
                  latest_state=$(gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews?per_page=100" \
                      --jq '[.[] | select(.user.login == "runeseer[bot]" and .commit_id == env.HEAD_SHA)]' \
                      | jq -s -r 'add // [] | sort_by(.submitted_at) | last | .state // ""') \
                      || { echo "could not read the pull request reviews; rerun the check"; exit 1; }
                  machine_verdict=$(latest_machine_verdict) \
                      || { echo "could not read the current Runeseer verdict; rerun the check"; exit 1; }
                  live=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}" --jq '[.head.sha, .base.sha] | @tsv') \
                      || { echo "could not read the live pull request; rerun the check"; exit 1; }
                  if [ "$live" != "$HEAD_SHA"$'\t'"$BASE_SHA" ]; then
                      echo "the pull request head or base changed; start a new review round"
                      exit 1
                  fi
                  if [ "$latest_state" = "APPROVED" ] && [ "$machine_verdict" = "clean:none" ]; then
                      state=$(ledger_state) \
                          || { echo "could not read the ledger for this head; rerun the check"; exit 1; }
                      case "$state" in
                          stale:late-thread)
                              echo "a review thread arrived after the verdict; the ledger generation moved and the approval is stale."
                              echo "push a fix or apply review:runeseer for one more adjudication on this head"
                              exit 1
                              ;;
                          stale:generation)
                              echo "the ledger generation moved past the verdict's; the approval is stale until a re-adjudication."
                              exit 1
                              ;;
                      esac
                      echo "Runeseer's latest review approves this head and current base (ledger: $state)."
                      exit 0
                  fi
                  echo "no standing clean Runeseer verdict for this head and base; apply the review label to start a round"
                  exit 1
