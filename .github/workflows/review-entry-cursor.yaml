name: Review Cursor Entry

# This API-only caller requests optional Bugbot reviews through Seer.
# The reusable workflow checks the live head and labels before dispatch.
# Keep head-controlled code outside this trusted workflow.
on:
    pull_request_target:
        types: [labeled, ready_for_review]

permissions:
    contents: read
    pull-requests: write
    issues: write

# Separate label groups preserve queued requests during unrelated label events.
concurrency:
    group: review-cursor-${{ github.event.pull_request.number }}-${{ github.event.label.name || 'ready' }}
    cancel-in-progress: false

jobs:
    summon:
        if: github.event.pull_request.draft == false && !contains(github.event.pull_request.labels.*.name, 'skip:cursor') && ((github.event.action == 'labeled' && github.event.label.name == 'review:cursor') || (github.event.action == 'ready_for_review' && contains(github.event.pull_request.labels.*.name, 'review:cursor')))
        uses: runedeck/seer/.github/workflows/review-cursor.yaml@main
        secrets:
            # Bugbot requires a human-authored summon.
            RUNEWRIGHT_GITHUB_TOKEN: ${{ secrets.RUNEWRIGHT_GITHUB_TOKEN }}
