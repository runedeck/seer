name: Review Cascade

# The default path runs Macroscope correctness before Runeseer adjudication.
# Bugbot, Cursor Security Agent, and CodeRabbit are independent optional reviews.
# This workflow uses APIs only. It never checks out pull request content.
# Callers own triggers, concurrency, and workflow-token permissions.
on:
    workflow_call:
        inputs:
            macroscope_correctness_check:
                description: Exact core correctness check name verified in Macroscope. Approvability and custom-agent checks are excluded.
                type: string
                required: false
                default: ""
        secrets:
            RUNEWRIGHT_APP_ID:
                required: true
            RUNEWRIGHT_APP_KEY:
                required: true
            # Accept older callers. Optional Bugbot authentication is unused here.
            RUNEWRIGHT_GITHUB_TOKEN:
                required: false

env:
    LABEL_ENTRY: review
    LABEL_MACROSCOPE: "review:macroscope"
    LABEL_MACROSCOPE_BLOCKED: "issue:macroscope"
    LABEL_RUNE_BLOCKED: "issue:rune"
    LABEL_RUNESEER: "review:runeseer"
    LABEL_STAGE_MACROSCOPE: "stage:macroscope"
    LABEL_SKIP_MACROSCOPE: "skip:macroscope"
    LABEL_SKIP_RUNESEER: "skip:runeseer"
    APP_MACROSCOPE: macroscopeapp
    CHECK_MACROSCOPE: ${{ inputs.macroscope_correctness_check }}
    POLL_SECONDS: 20
    POLL_ROUNDS_MACROSCOPE: 30

jobs:
    cascade:
        name: cascade
        if: github.event.pull_request.draft == false && (github.event.label.name == 'review' || contains(fromJSON('["opened", "ready_for_review"]'), github.event.action))
        runs-on: ubuntu-latest
        timeout-minutes: 45
        steps:
            - id: live
              name: Verify the review label is live
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -o pipefail
                  # Every event requires the maintainer's live request label.
                  labels=$(gh api --paginate "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/labels?per_page=100" \
                      --jq '[.[].name]' | jq -s 'add // []')
                  if jq -e 'index("review") != null' <<<"$labels" >/dev/null; then
                      echo "live=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "live=false" >> "$GITHUB_OUTPUT"
                      echo "No live review request."
                  fi

            - id: runewright
              if: steps.live.outputs.live == 'true'
              uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
              with:
                  app-id: ${{ secrets.RUNEWRIGHT_APP_ID }}
                  private-key: ${{ secrets.RUNEWRIGHT_APP_KEY }}

            - name: Run the review cascade
              if: steps.live.outputs.live == 'true'
              env:
                  GH_TOKEN: ${{ steps.runewright.outputs.token }}
                  CALLER_TOKEN: ${{ github.token }}
                  REPO: ${{ github.repository }}
                  PR: ${{ github.event.pull_request.number }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
                  IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
              run: |
                  set -o pipefail
                  fail_cascade() {
                      echo "::error::$1"
                      echo "The review request remains available. Repair the cause. Remove and reapply review on the final head."
                      exit 1
                  }

                  api_failure() {
                      case "$2" in
                          *"HTTP 401"*) fail_cascade "GitHub rejected authentication during $1 (HTTP 401). The owner must inspect the relevant token." ;;
                          *"HTTP 403"*) fail_cascade "GitHub denied $1 (HTTP 403). Inspect token permissions, installation access, and repository policy." ;;
                          *) fail_cascade "GitHub did not confirm $1. Inspect the workflow log before retrying." ;;
                      esac
                  }

                  head_still() {
                      live=$(GH_TOKEN=$CALLER_TOKEN gh api "repos/$REPO/pulls/$PR" --jq '.head.sha' 2>&1) \
                          || api_failure "the current-head read" "$live"
                      [ "$live" = "$HEAD_SHA" ] \
                          || fail_cascade "The head moved from $HEAD_SHA to $live. Request review on the final head."
                  }

                  refresh_labels() {
                      labels=$(GH_TOKEN=$CALLER_TOKEN gh api --paginate "repos/$REPO/issues/$PR/labels?per_page=100" \
                          --jq '[.[].name]' | jq -s 'add // []') \
                          || fail_cascade "Cannot read the current labels."
                  }

                  has_label() {
                      jq -e --arg label "$1" 'index($label) != null' <<<"$labels" >/dev/null
                  }

                  require_live_request() {
                      refresh_labels
                      if ! has_label "$LABEL_ENTRY"; then
                          echo "The review request was withdrawn. No new review will be dispatched."
                          exit 0
                      fi
                  }

                  ensure_label() {
                      local response
                      response=$(gh api -X POST "repos/$REPO/issues/$PR/labels" -f "labels[]=$1" 2>&1) \
                          || api_failure "dispatch of $1" "$response"
                  }

                  consume_label() {
                      local response encoded action
                      encoded=${1//:/%3A}
                      action=${2:-"consumption of $1"}
                      # Workflow-token consumption emits no new workflow event.
                      # Never replace this token with an App-token fallback.
                      if response=$(GH_TOKEN=$CALLER_TOKEN gh api -X DELETE \
                          "repos/$REPO/issues/$PR/labels/$encoded" 2>&1); then
                          return 0
                      fi
                      case "$response" in *"HTTP 404"*) return 0 ;; esac
                      api_failure "$action" "$response"
                  }

                  consume_entry_label() {
                      consume_label "$LABEL_ENTRY" "request consumption"
                  }

                  latest_run() {
                      # Filter raw results here so another product or head cannot qualify.
                      GH_TOKEN=$CALLER_TOKEN gh api --paginate \
                          "repos/$REPO/commits/$HEAD_SHA/check-runs?per_page=100" --jq '.check_runs' \
                          | jq -s --arg app "$APP_MACROSCOPE" --arg name "$CHECK_MACROSCOPE" --arg head "$HEAD_SHA" \
                        'add // [] | map(select(.app.slug == $app and .name == $name and .head_sha == $head))
                        | map(select((.output.text // "" | test("(^|\\n)[[:space:]>]*Your check run agent prompt is:"; "i")) | not))
                        | sort_by(.id) | last // null'
                  }

                  # Zero permits reuse of an existing current-head round.
                  # A fresh dispatch advances the baseline before the provider receives it.
                  review_after_id=0
                  review_completed() {
                      jq -e --argjson after "$review_after_id" \
                          '(.id // 0) > $after and .status == "completed" and (.conclusion == "success" or .conclusion == "neutral")' \
                          <<<"$run" >/dev/null
                  }

                  review_active() {
                      jq -e '.status == "queued" or .status == "in_progress" or .status == "pending" or .status == "waiting" or .status == "requested"' \
                          <<<"$run" >/dev/null
                  }

                  request_macroscope() {
                      head_still
                      require_live_request
                      run=$(latest_run) || fail_cascade "Cannot read Macroscope correctness checks."
                      # Recheck live recovery before changing any provider label.
                      if review_completed || review_active; then
                          return 0
                      fi
                      if has_label "$LABEL_MACROSCOPE_BLOCKED"; then
                          fail_cascade "$LABEL_MACROSCOPE_BLOCKED is present. Repair the provider failure and clear the blocker before another request."
                      fi
                      # Re-adding an existing label emits no fresh request event.
                      # Only an eligible explicit retry rearms that provider label.
                      if has_label "$LABEL_MACROSCOPE"; then
                          consume_label "$LABEL_MACROSCOPE"
                      fi
                      head_still
                      run=$(latest_run) || fail_cascade "Cannot read Macroscope correctness checks."
                      if review_completed || review_active; then
                          return 0
                      fi
                      require_live_request
                      # Capture the latest visible generation before dispatch, never after it.
                      run=$(latest_run) || fail_cascade "Cannot read Macroscope correctness checks."
                      if review_completed || review_active; then
                          return 0
                      fi
                      review_after_id=$(jq -r '.id // 0' <<<"$run")
                      ensure_label "$LABEL_MACROSCOPE"
                  }

                  head_still
                  require_live_request
                  echo "stage 1: macroscope"
                  if has_label "$LABEL_SKIP_MACROSCOPE"; then
                      echo "$LABEL_SKIP_MACROSCOPE is present. No Macroscope review is recorded."
                  else
                      [ -n "$CHECK_MACROSCOPE" ] || fail_cascade "MACROSCOPE_CORRECTNESS_CHECK is unset. Enable core correctness for review:macroscope and bind its observed exact check name."
                      check_lower=$(printf '%s' "$CHECK_MACROSCOPE" | tr '[:upper:]' '[:lower:]')
                      case "$check_lower" in
                          *approvability*|*eligibility*|*conventions*|*custom*|*security\ agent*)
                              fail_cascade "MACROSCOPE_CORRECTNESS_CHECK names an excluded check. Configure the observed core correctness check, not approvability or a custom agent." ;;
                      esac
                      run=$(latest_run) || fail_cascade "Cannot read Macroscope correctness checks."
                      if ! review_completed; then
                          # An existing current-head run needs no duplicate request.
                          if ! review_active; then
                              request_macroscope
                          fi
                          for _ in $(seq 1 "$POLL_ROUNDS_MACROSCOPE"); do
                              head_still
                              run=$(latest_run) || fail_cascade "Cannot read Macroscope correctness checks."
                              review_completed && break
                              # An old check cannot report the outcome of a fresh request.
                              if jq -e --argjson after "$review_after_id" \
                                  '(.id // 0) > $after and .status == "completed"' <<<"$run" >/dev/null; then
                                  conclusion=$(jq -r '.conclusion // "unknown"' <<<"$run")
                                  # Blocker metadata must not emit another workflow event.
                                  GH_TOKEN=$CALLER_TOKEN ensure_label "$LABEL_MACROSCOPE_BLOCKED"
                                  fail_cascade "Macroscope correctness ended as $conclusion. No completed review is recorded."
                              fi
                              sleep "$POLL_SECONDS"
                          done
                      fi
                      review_completed || fail_cascade "Macroscope correctness did not complete. Verify provider label settings and the configured check identity."
                      head_still
                      refresh_labels
                      if has_label "$LABEL_MACROSCOPE_BLOCKED"; then
                          consume_label "$LABEL_MACROSCOPE_BLOCKED"
                      fi
                      conclusion=$(jq -r '.conclusion' <<<"$run")
                      echo "Macroscope correctness completed as $conclusion. Runeseer will adjudicate its findings."
                      # Stage labels are informational. A later round still checks its head.
                      ensure_label "$LABEL_STAGE_MACROSCOPE"
                  fi

                  if [ "$IS_FORK" = "true" ]; then
                      consume_entry_label
                      echo "Fork cascade complete. The owner must review this pull request."
                      exit 0
                  fi

                  head_still
                  # Finish an active provider round, but authorize each new dispatch again.
                  require_live_request
                  echo "stage 2: runeseer"
                  if has_label "$LABEL_SKIP_RUNESEER"; then
                      consume_entry_label
                      echo "$LABEL_SKIP_RUNESEER is present. Runeseer is not summoned."
                      exit 0
                  fi
                  if has_label "$LABEL_RUNE_BLOCKED"; then
                      fail_cascade "$LABEL_RUNE_BLOCKED is present. Repair the correctness failure before another request."
                  fi
                  # A bare review request cancels an active correctness run.
                  # Remove its existing label before dispatch so GitHub emits a new event.
                  if has_label "$LABEL_RUNESEER"; then
                      consume_label "$LABEL_RUNESEER"
                  fi
                  head_still
                  require_live_request
                  ensure_label "$LABEL_RUNESEER"
                  head_still
                  consume_entry_label
                  echo "Runeseer was summoned. Only its clean current-head verdict can earn approval."
