name: Review Cascade

# Reusable review cascade: cursor first, then macroscope, then runeseer,
# each stage summoned only after the previous one settles clean on an unmoved
# head. Stages settle once per pull request: a settled stage is recorded as a
# stage label and later rounds go straight to the adjudicator, provided the
# stage's findings stay resolved. Runeseer clears stage labels when a delta
# warrants a fresh pass, and the owner clears them to force one. Findings or a
# head change stop the cascade and fail this check; runeseer's own verdict
# gates review/correctness, not this job. Callers trigger on
# pull_request_target opened, ready_for_review, and labeled: every ready pull
# request runs the cascade once automatically, and the review label re-summons
# it after fixes. The cascade is API-only, checks out nothing, and fork pull
# requests need the base-context secrets.
#
# Cursor has no label trigger, so stage 1 is a standalone runewright
# `@cursor review` comment; runewright's token also applies stage labels, because
# label events created by the workflow token would not trigger the lanes
# listening for them.
on:
    workflow_call:
        secrets:
            RUNEWRIGHT_APP_ID:
                required: true
            RUNEWRIGHT_APP_KEY:
                required: true
            # Cursor ignores bot-authored trigger comments, so the request
            # rides an owner-minted fine-grained token when one is provided.
            RUNEWRIGHT_GITHUB_TOKEN:
                required: false

# Single declaration point for every identity, label, and tunable this
# body uses. Job-level if expressions cannot read env, so the entry
# label stays literal in the guard below.
env:
    LABEL_ENTRY: review
    LABEL_CURSOR_BLOCKED: "issue:cursor"
    LABEL_MACROSCOPE: "review:macroscope"
    LABEL_MACROSCOPE_BLOCKED: "issue:macroscope"
    LABEL_RUNE_BLOCKED: "issue:rune"
    LABEL_RUNESEER: "review:runeseer"
    LABEL_STAGE_CURSOR: "stage:cursor"
    LABEL_STAGE_MACROSCOPE: "stage:macroscope"
    # Two owner overrides per lane, and the difference is what survives.
    # skip: the lane never runs, so no finding is ever produced. ignore: the
    # lane runs and reports in full, and its findings stay on the pull
    # request as a record while losing their power to hold the merge.
    LABEL_SKIP_CURSOR: "skip:cursor"
    LABEL_SKIP_MACROSCOPE: "skip:macroscope"
    LABEL_SKIP_RUNESEER: "skip:runeseer"
    LABEL_IGNORE_CURSOR: "ignore:cursor"
    LABEL_IGNORE_MACROSCOPE: "ignore:macroscope"
    LABEL_COLOR: "5319e7"
    LABEL_DESCRIPTION: Summons this review lane
    APP_CURSOR: cursor
    APP_MACROSCOPE: macroscopeapp
    BOT_CURSOR: cursor
    BOT_MACROSCOPE: macroscopeapp
    REST_BOT_CURSOR: "cursor[bot]"
    REST_BOT_MACROSCOPE: "macroscopeapp[bot]"
    SUMMON_COMMENT: "@cursor review"
    POLL_SECONDS: 20
    POLL_ROUNDS_CURSOR: 54
    POLL_ROUNDS_MACROSCOPE: 30

jobs:
    cascade:
        name: cascade
        if: github.event.pull_request.draft == false && (github.event.label.name == 'review' || contains(fromJSON('["opened", "ready_for_review"]'), github.event.action))
        runs-on: ubuntu-latest
        timeout-minutes: 45
        steps:
            # A queued run keeps its event payload after the labels moved on,
            # so the live labels decide whether the requested round still stands; a
            # consumed review label stops the cascade without a failure.
            - id: live
              name: Verify the review label is live
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  labels=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/labels" --jq '.[].name')
                  if printf '%s\n' "$labels" | grep -qx review; then
                      echo "live=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "live=false" >> "$GITHUB_OUTPUT"
                      echo "no live review label on this pull request; the cascade stands down."
                  fi

            - id: runewright
              if: steps.live.outputs.live == 'true'
              uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
              with:
                  app-id: ${{ secrets.RUNEWRIGHT_APP_ID }}
                  private-key: ${{ secrets.RUNEWRIGHT_APP_KEY }}

            - name: Run the review cascade
              if: steps.live.outputs.live == 'true'
              env:
                  GH_TOKEN: ${{ steps.runewright.outputs.token }}
                  # Cursor drops bot-authored trigger comments, so the request
                  # prefers the owner-minted token and falls back to runewright
                  # only where no owner-minted token is configured.
                  SUMMON_TOKEN: ${{ secrets.RUNEWRIGHT_GITHUB_TOKEN }}
                  # Reads ride the workflow token; label writes ride
                  # runewright, because the callers' grants stop at issues and
                  # pull-request label writes 403 under the workflow token.
                  CALLER_TOKEN: ${{ github.token }}
                  REPO: ${{ github.repository }}
                  PR: ${{ github.event.pull_request.number }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
                  IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
              run: |
                  # Label writes ride runewright: the workflow token's caller
                  # grants stop at issues, and pull-request label writes 403
                  # under it. Runewright's removals emit unlabeled events no
                  # caller listens to, and its stage and blocker adds fail the
                  # cascade and correctness guards, so nothing re-enters.
                  consume_entry_label() {
                      gh api -X DELETE \
                          "repos/$REPO/issues/$PR/labels/$LABEL_ENTRY" >/dev/null 2>&1 || true
                  }

                  fail_cascade() {
                      echo "$1"
                      # Consuming the entry label makes re-applying it restart
                      # the cascade after fixes.
                      consume_entry_label
                      exit 1
                  }

                  head_still() {
                      live=$(GH_TOKEN=$CALLER_TOKEN gh api "repos/$REPO/pulls/$PR" --jq '.head.sha')
                      [ "$live" = "$HEAD_SHA" ] || fail_cascade "the head moved from $HEAD_SHA to $live during the cascade; re-apply $LABEL_ENTRY on the new head."
                  }

                  # Reads ride the caller token: runewright's app permissions
                  # deliberately exclude Checks, and its writes stay scoped to
                  # comments and label adds.
                  unresolved_by() {
                      cursor=""
                      open=0
                      while :; do
                          cursor_arg=()
                          [ -n "$cursor" ] && cursor_arg=(-f cursor="$cursor")
                          page=$(GH_TOKEN=$CALLER_TOKEN gh api graphql -f query='query($owner: String!, $repo: String!, $number: Int!, $cursor: String) {
                              repository(owner: $owner, name: $repo) {
                                  pullRequest(number: $number) {
                                      reviewThreads(first: 100, after: $cursor) {
                                          pageInfo { hasNextPage endCursor }
                                          nodes { isResolved comments(first: 1) { nodes { author { login } } } }
                                      }
                                  }
                              }
                          }' -f owner="${REPO%/*}" -f repo="${REPO#*/}" -F number="$PR" "${cursor_arg[@]}" \
                              --jq '.data.repository.pullRequest.reviewThreads')
                          open=$(( open + $(jq "[.nodes[] | select(.isResolved == false) | select(.comments.nodes[0].author.login == \"$1\")] | length" <<<"$page") ))
                          [ "$(jq -r '.pageInfo.hasNextPage' <<<"$page")" = "true" ] || break
                          cursor=$(jq -r '.pageInfo.endCursor' <<<"$page")
                      done
                      echo "$open"
                  }

                  # Per-page jq output is merged with jq -s because the runner's
                  # gh predates --slurp.
                  latest_runs() {
                      GH_TOKEN=$CALLER_TOKEN gh api --paginate \
                          "repos/$REPO/commits/$HEAD_SHA/check-runs?per_page=100" \
                          --jq "[.check_runs[] | select(.app.slug == \"$1\")]" \
                          | jq -s 'add // [] | group_by(.name) | map(sort_by(.started_at) | last)'
                  }

                  # A lane that declines one of its own checks reports it
                  # skipped, which is a decision rather than a fault, so it
                  # counts as clean here. Real faults are failed_check's
                  # territory, and a lane whose every check skips has still
                  # concluded. Omitting skipped strands a lane forever: its
                  # stage can only ever wait out the poll budget.
                  settled() {
                      runs=$(latest_runs "$1")
                      total=$(jq 'length' <<<"$runs")
                      clean_count=$(jq '[.[] | select(.status == "completed") | select(.conclusion as $conclusion | ["success", "neutral", "skipped"] | index($conclusion))] | length' <<<"$runs")
                      [ "$total" != "0" ] && [ "$clean_count" = "$total" ]
                  }

                  failed_check() {
                      runs=$(latest_runs "$1")
                      jq -r '[.[]
                          | select(.status == "completed")
                          | select(.conclusion as $conclusion | ["failure", "cancelled", "timed_out", "action_required", "stale", "startup_failure"] | index($conclusion))
                          | .html_url] | first // empty' <<<"$runs"
                  }

                  latest_comment_id() {
                      GH_TOKEN=$CALLER_TOKEN gh api --paginate \
                          "repos/$REPO/issues/$PR/comments?per_page=100" \
                          --jq '[.[].id]' | jq -s 'add // [] | max // 0'
                  }

                  terminal_comment_after() {
                      comments=$(GH_TOKEN=$CALLER_TOKEN gh api --paginate \
                          "repos/$REPO/issues/$PR/comments?per_page=100" \
                          --jq "[.[] | select(.id > $1) | select(.user.login == \"$2\") | select(.body | test(\"couldn.t run|unable to run|failed to run|usage limit|spend limit|is paused|usage-based billing\"; \"i\")) | .html_url]" \
                          | jq -s 'add // []')
                      jq -r 'first // empty' <<<"$comments"
                  }

                  blocked() {
                      GH_TOKEN=$CALLER_TOKEN gh api --paginate "repos/$REPO/issues/$PR/labels?per_page=100" \
                          --jq "[.[].name]" | jq -s "add // [] | index(\"$1\") != null" | grep -qx true
                  }

                  mark_blocked() {
                      encoded=$(printf '%s' "$1" | sed 's/:/%3A/')
                      gh api "repos/$REPO/labels/$encoded" >/dev/null 2>&1 \
                          || gh api -X POST "repos/$REPO/labels" \
                              -f name="$1" -f color="$LABEL_COLOR" \
                              -f description="Review provider requires intervention" >/dev/null
                      # An issue: label event fails every lane guard, so this
                      # blocker cannot re-enter or relaunch a cascade.
                      gh api -X POST \
                          "repos/$REPO/issues/$PR/labels" -f "labels[]=$1" >/dev/null
                  }

                  clear_label() {
                      encoded=$(printf '%s' "$1" | sed 's/:/%3A/')
                      gh api -X DELETE \
                          "repos/$REPO/issues/$PR/labels/$encoded" >/dev/null 2>&1 || true
                  }

                  # An ignored lane reports in full; only its power to stop the
                  # funnel is withdrawn. A terminal provider failure still
                  # fails: that is a broken lane, not a judged one, and skip:
                  # is the override for a lane that should not run at all.
                  # Callers read stage_unsettled rather than a return code:
                  # wrapping this call in `if` would disable errexit for its
                  # whole body, so a failed API read inside would stop aborting
                  # and could report a stage settled that never was.
                  stage_unsettled=false
                  wait_clean() {
                      app=$1; bot=$2; stage=$3; comment_after=${4:-0}; rest_bot=${5:-}; blocker=${6:-}; summon_label=${7:-}; poll_rounds=$8; ignore_label=${9:-}
                      stage_unsettled=false
                      ignored=false
                      if [ -n "$ignore_label" ] && blocked "$ignore_label"; then
                          ignored=true
                      fi
                      round=0
                      for _ in $(seq 1 "$poll_rounds"); do
                          round=$((round + 1))
                          if settled "$app"; then
                              [ -z "$blocker" ] || clear_label "$blocker"
                              head_still
                              open=$(unresolved_by "$bot")
                              [ "$open" = "0" ] && { echo "$stage settled clean"; return 0; }
                              [ "$ignored" = "true" ] && {
                                  echo "$ignore_label present; $stage holds $open unresolved findings that no longer hold the funnel."
                                  return 0
                              }
                              fail_cascade "$stage holds $open unresolved findings; the funnel stops here."
                          fi
                          # A freshly applied review label needs a few rounds to register its new
                          # check run; until then a leftover failed run from the
                          # previous attempt must not trip the breaker.
                          failure_url=""
                          [ "$round" -gt 3 ] && failure_url=$(failed_check "$app")
                          if [ -n "$failure_url" ]; then
                              head_still
                              open=$(unresolved_by "$bot")
                              if [ "$open" != "0" ] && [ "$ignored" != "true" ]; then
                                  fail_cascade "$stage holds $open unresolved findings; the funnel stops here."
                              fi
                              [ -z "$summon_label" ] || clear_label "$summon_label"
                              [ -z "$blocker" ] || mark_blocked "$blocker"
                              fail_cascade "$stage reported a terminal provider failure: $failure_url"
                          fi
                          if [ -n "$rest_bot" ]; then
                              failure_url=$(terminal_comment_after "$comment_after" "$rest_bot")
                              if [ -n "$failure_url" ]; then
                                  [ -z "$summon_label" ] || clear_label "$summon_label"
                                  [ -z "$blocker" ] || mark_blocked "$blocker"
                                  fail_cascade "$stage reported a terminal provider failure: $failure_url"
                              fi
                          fi
                          sleep "$POLL_SECONDS"
                      done
                      # A lane that never reported has settled nothing, so the
                      # caller must not record a stage label for it. This
                      # releases the funnel without claiming settled work.
                      [ "$ignored" = "true" ] && {
                          echo "$ignore_label present; $stage did not settle within the poll budget and no longer holds the funnel."
                          stage_unsettled=true
                          return 0
                      }
                      fail_cascade "$stage did not settle within the poll budget; the funnel stops here."
                  }

                  ensure_label() {
                      encoded=$(printf '%s' "$1" | sed 's/:/%3A/')
                      gh api "repos/$REPO/labels/$encoded" >/dev/null 2>&1 \
                          || gh api -X POST "repos/$REPO/labels" \
                              -f name="$1" -f color="$LABEL_COLOR" \
                              -f description="$LABEL_DESCRIPTION" >/dev/null
                      gh api -X POST "repos/$REPO/issues/$PR/labels" -f "labels[]=$1" >/dev/null
                  }

                  # Stage labels record settled stages across pushes: fix
                  # rounds return straight to the adjudicator instead of
                  # respending the whole funnel. A stage: label event fails
                  # every lane guard, so marking one re-enters nothing.
                  # Runeseer clears them when a delta warrants a fresh pass,
                  # and the owner clears them to force one.
                  mark_stage() {
                      encoded=$(printf '%s' "$1" | sed 's/:/%3A/')
                      gh api "repos/$REPO/labels/$encoded" >/dev/null 2>&1 \
                          || gh api -X POST "repos/$REPO/labels" \
                              -f name="$1" -f color="0e8a16" \
                              -f description="Stage settled clean; remove to re-run it" >/dev/null
                      gh api -X POST \
                          "repos/$REPO/issues/$PR/labels" -f "labels[]=$1" >/dev/null
                  }

                  # A settled stage still holds its findings resolved: an
                  # unresolved thread from that lane reopens the gate without
                  # respending the provider.
                  verify_stage_threads() {
                      open=$(unresolved_by "$1")
                      [ "$open" = "0" ] && return 0
                      if [ -n "${3:-}" ] && blocked "$3"; then
                          echo "$3 present; $2 holds $open unresolved findings that no longer hold the funnel."
                          return 0
                      fi
                      fail_cascade "$2 holds $open unresolved findings; resolve them before the funnel continues."
                  }

                  # GraphQL bot logins are bare (cursor, macroscopeapp); REST
                  # issue-comment logins carry the [bot] suffix.
                  echo "stage 1: cursor"
                  if blocked "$LABEL_SKIP_CURSOR"; then
                      echo "$LABEL_SKIP_CURSOR present; the cursor stage never runs."
                  elif blocked "$LABEL_STAGE_CURSOR"; then
                      verify_stage_threads "$BOT_CURSOR" "cursor" "$LABEL_IGNORE_CURSOR"
                      echo "cursor stage already settled; not re-summoned."
                  else
                      cursor_comment_id=0
                      if settled "$APP_CURSOR"; then
                          echo "cursor already settled on this head; not asking it again."
                      elif blocked "$LABEL_CURSOR_BLOCKED"; then
                          fail_cascade "$LABEL_CURSOR_BLOCKED is present; clear the provider problem before re-summoning."
                      else
                          # Cursor ignores bot-authored comments, so only the
                          # owner-minted token can actually summon it. Falling
                          # back to runewright posts a comment Cursor will never
                          # answer, and the stage then dies of the poll budget
                          # with a message blaming the lane for a token fault.
                          # Naming the fault here costs seconds instead.
                          # Posting as a bot succeeds and still gets ignored, so
                          # an absent token has to be caught before the request,
                          # not by its result.
                          if [ -z "$SUMMON_TOKEN" ]; then
                              fail_cascade "no summon token is configured, and Cursor ignores bot-authored comments, so this stage could only wait out its poll budget. Configure RUNEWRIGHT_GITHUB_TOKEN, or apply $LABEL_SKIP_CURSOR to stand the stage down."
                          fi
                          if ! cursor_comment_id=$(GH_TOKEN=$SUMMON_TOKEN gh api -X POST \
                              "repos/$REPO/issues/$PR/comments" -f body="$SUMMON_COMMENT" --jq '.id' 2>&1); then
                              fail_cascade "the summon token cannot comment on $REPO, so Cursor can never be asked: $cursor_comment_id. Grant RUNEWRIGHT_GITHUB_TOKEN access to this repository, or apply $LABEL_SKIP_CURSOR to stand the stage down."
                          fi
                      fi
                      wait_clean "$APP_CURSOR" "$BOT_CURSOR" "cursor" \
                          "$cursor_comment_id" "$REST_BOT_CURSOR" "$LABEL_CURSOR_BLOCKED" "" "$POLL_ROUNDS_CURSOR" \
                          "$LABEL_IGNORE_CURSOR"
                      [ "$stage_unsettled" = "true" ] || mark_stage "$LABEL_STAGE_CURSOR"
                  fi

                  echo "stage 2: macroscope"
                  head_still
                  # Skipping this stage leaves the adjudicating lane judging the
                  # head, so the required verdict mirror can still clear.
                  if blocked "$LABEL_SKIP_MACROSCOPE"; then
                      echo "$LABEL_SKIP_MACROSCOPE present; the macroscope stage never runs."
                  elif blocked "$LABEL_STAGE_MACROSCOPE"; then
                      verify_stage_threads "$BOT_MACROSCOPE" "macroscope" "$LABEL_IGNORE_MACROSCOPE"
                      echo "macroscope stage already settled; not re-summoned."
                  else
                      macroscope_comment_id=$(latest_comment_id)
                      if ! settled "$APP_MACROSCOPE"; then
                          if blocked "$LABEL_MACROSCOPE_BLOCKED"; then
                              fail_cascade "$LABEL_MACROSCOPE_BLOCKED is present; clear the provider problem before re-summoning."
                          fi
                          ensure_label "$LABEL_MACROSCOPE"
                      fi
                      wait_clean "$APP_MACROSCOPE" "$BOT_MACROSCOPE" "macroscope" \
                          "$macroscope_comment_id" "$REST_BOT_MACROSCOPE" "$LABEL_MACROSCOPE_BLOCKED" "$LABEL_MACROSCOPE" "$POLL_ROUNDS_MACROSCOPE" \
                          "$LABEL_IGNORE_MACROSCOPE"
                      [ "$stage_unsettled" = "true" ] || mark_stage "$LABEL_STAGE_MACROSCOPE"
                  fi

                  # The paid lane cannot run on fork pull requests (its
                  # secrets are stripped there), so their funnel ends clean at
                  # the free lanes and the owner reviews next.
                  if [ "$IS_FORK" = "true" ]; then
                      consume_entry_label
                      echo "fork funnel complete: both free lanes settled clean; the owner's review is the remaining gate."
                      exit 0
                  fi

                  echo "stage 3: runeseer"
                  head_still
                  # The lane's own guard stands it down on skip:runeseer, so
                  # summoning it would only spend a round to reach the same
                  # place. ignore:runeseer still summons: its judgment is
                  # wanted on the record, just not as a gate.
                  if blocked "$LABEL_SKIP_RUNESEER"; then
                      # The cascade ends here, so the entry label is consumed
                      # exactly as on every other ending: re-applying it is
                      # what starts the next round.
                      consume_entry_label
                      echo "$LABEL_SKIP_RUNESEER present; the correctness lane is not summoned."
                      exit 0
                  fi
                  if blocked "$LABEL_RUNE_BLOCKED"; then
                      fail_cascade "$LABEL_RUNE_BLOCKED is present; clear the provider problem before re-summoning."
                  fi
                  ensure_label "$LABEL_RUNESEER"
                  echo "runeseer summoned; its clean verdict earns the approval, and only then does the pull request reach the owner."
