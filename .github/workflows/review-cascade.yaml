name: Review Cascade

# Reusable body of the funnel walk: cursor first, then macroscope, then
# runeseer, each stage summoned only after the previous settles clean on
# an unmoved head. A stage that holds findings — or a head that moves
# mid-walk — stops the walk and fails this check; runeseer's own verdict
# gates the review/correctness check, not this one. Callers trigger on
# pull_request_target labeled: the walk is API-only, checks out nothing,
# and fork pull requests need the base-context secrets.
#
# Cursor has no label trigger, so stage 1 is a runewright `bugbot run`
# comment; runewright's token also applies the stage labels, because
# label events created by the workflow token would not trigger the lanes
# listening for them.
on:
    workflow_call:
        secrets:
            RUNEWRIGHT_APP_ID:
                required: true
            RUNEWRIGHT_APP_KEY:
                required: true

jobs:
    walk:
        name: walk
        if: github.event.label.name == 'review' && github.event.pull_request.draft == false
        runs-on: ubuntu-latest
        timeout-minutes: 45
        steps:
            - id: runewright
              uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
              with:
                  app-id: ${{ secrets.RUNEWRIGHT_APP_ID }}
                  private-key: ${{ secrets.RUNEWRIGHT_APP_KEY }}

            - name: Walk the funnel
              env:
                  GH_TOKEN: ${{ steps.runewright.outputs.token }}
                  # Label deletion runs on the workflow token, deliberately:
                  # its events trigger no workflows, so consuming a label can
                  # never cancel an in-flight lane through the callers'
                  # unlabeled handling.
                  CALLER_TOKEN: ${{ github.token }}
                  REPO: ${{ github.repository }}
                  PR: ${{ github.event.pull_request.number }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
                  IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
              run: |
                  consume_entry_label() {
                      GH_TOKEN=$CALLER_TOKEN gh api -X DELETE \
                          "repos/$REPO/issues/$PR/labels/review" >/dev/null 2>&1 || true
                  }

                  fail_walk() {
                      echo "$1"
                      # Consuming the entry label makes re-applying it restart
                      # the walk after fixes.
                      consume_entry_label
                      exit 1
                  }

                  head_still() {
                      live=$(GH_TOKEN=$CALLER_TOKEN gh api "repos/$REPO/pulls/$PR" --jq '.head.sha')
                      [ "$live" = "$HEAD_SHA" ] || fail_walk "the head moved from $HEAD_SHA to $live mid-walk; re-apply review on the new head."
                  }

                  # Reads ride the caller token: runewright's app permissions
                  # deliberately exclude Checks, and its writes stay scoped to
                  # comments and label adds.
                  unresolved_by() {
                      cursor=""
                      open=0
                      while :; do
                          cursor_arg=()
                          [ -n "$cursor" ] && cursor_arg=(-f cursor="$cursor")
                          page=$(GH_TOKEN=$CALLER_TOKEN gh api graphql -f query='query($owner: String!, $repo: String!, $number: Int!, $cursor: String) {
                              repository(owner: $owner, name: $repo) {
                                  pullRequest(number: $number) {
                                      reviewThreads(first: 100, after: $cursor) {
                                          pageInfo { hasNextPage endCursor }
                                          nodes { isResolved comments(first: 1) { nodes { author { login } } } }
                                      }
                                  }
                              }
                          }' -f owner="${REPO%/*}" -f repo="${REPO#*/}" -F number="$PR" "${cursor_arg[@]}" \
                              --jq '.data.repository.pullRequest.reviewThreads')
                          open=$(( open + $(jq "[.nodes[] | select(.isResolved == false) | select(.comments.nodes[0].author.login == \"$1\")] | length" <<<"$page") ))
                          [ "$(jq -r '.pageInfo.hasNextPage' <<<"$page")" = "true" ] || break
                          cursor=$(jq -r '.pageInfo.endCursor' <<<"$page")
                      done
                      echo "$open"
                  }

                  # Settled means the LATEST run of each of this app's checks
                  # on the head completed as success or neutral: a skipped
                  # summoned lane reviewed nothing, and a failed one is not
                  # settled — the walk keeps waiting for the re-run the summon
                  # provokes, and the timeout is the honest failure if none
                  # comes. A run that already completed clean on this head
                  # before the summon counts: per-head review is idempotent
                  # and re-review would only respend.
                  settled() {
                      runs=$(GH_TOKEN=$CALLER_TOKEN gh api --paginate --slurp "repos/$REPO/commits/$HEAD_SHA/check-runs?per_page=100" \
                          --jq "[.[].check_runs[] | select(.app.slug == \"$1\")]
                              | group_by(.name) | map(sort_by(.started_at) | last)")
                      total=$(jq 'length' <<<"$runs")
                      clean_count=$(jq '[.[] | select(.status == "completed") | select(.conclusion as $c | ["success", "neutral"] | index($c))] | length' <<<"$runs")
                      [ "$total" != "0" ] && [ "$clean_count" = "$total" ]
                  }

                  wait_clean() {
                      app=$1; bot=$2; stage=$3
                      for _ in $(seq 1 60); do
                          if settled "$app"; then
                              head_still
                              open=$(unresolved_by "$bot")
                              [ "$open" = "0" ] && { echo "$stage settled clean"; return 0; }
                              fail_walk "$stage holds $open unresolved findings; the funnel stops here."
                          fi
                          sleep 20
                      done
                      fail_walk "$stage did not settle within 20m; the funnel stops here."
                  }

                  ensure_label() {
                      encoded=$(printf '%s' "$1" | sed 's/:/%3A/')
                      gh api "repos/$REPO/labels/$encoded" >/dev/null 2>&1 \
                          || gh api -X POST "repos/$REPO/labels" \
                              -f name="$1" -f color="5319e7" \
                              -f description="Summons this review lane" >/dev/null
                      gh api -X POST "repos/$REPO/issues/$PR/labels" -f "labels[]=$1" >/dev/null
                  }

                  # GraphQL bot logins are bare (cursor, macroscopeapp) —
                  # never the REST-style cursor[bot]. A head cursor already
                  # settled on is not re-summoned: per-head review is
                  # idempotent and the comment would only respend.
                  echo "stage 1: cursor"
                  if settled cursor; then
                      echo "cursor already settled on this head; skipping the summon."
                  else
                      gh api -X POST "repos/$REPO/issues/$PR/comments" -f body="bugbot run" >/dev/null
                  fi
                  wait_clean cursor "cursor" "cursor"

                  echo "stage 2: macroscope"
                  head_still
                  ensure_label "review:macroscope"
                  wait_clean macroscopeapp "macroscopeapp" "macroscope"

                  # The paid lane cannot run on fork pull requests (its
                  # secrets are stripped there), so their funnel ends clean at
                  # the free lanes and the owner reviews next.
                  if [ "$IS_FORK" = "true" ]; then
                      consume_entry_label
                      echo "fork funnel complete: both free lanes settled clean; the owner's review is the remaining gate."
                      exit 0
                  fi

                  echo "stage 3: runeseer"
                  head_still
                  ensure_label "review:runeseer"
                  echo "runeseer summoned; its clean verdict earns the approval, and only then does the pull request reach the owner."
