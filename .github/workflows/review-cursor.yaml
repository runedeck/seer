name: Review Cursor

# This optional lane dispatches Bugbot through an owner-authored comment.
# A successful dispatch consumes review:cursor with the workflow token.
# A failed dispatch preserves the label. This job records no review verdict.
# Cursor Security Agent runs separately. The default cascade uses neither product.
on:
    workflow_call:
        secrets:
            RUNEWRIGHT_APP_ID:
                required: false
            RUNEWRIGHT_APP_KEY:
                required: false
            RUNEWRIGHT_GITHUB_TOKEN:
                required: true

env:
    SUMMON_COMMENT: "@cursor review"

jobs:
    summon:
        name: summon
        if: github.event.pull_request.draft == false
        runs-on: ubuntu-latest
        timeout-minutes: 3
        steps:
            # A queued run keeps its event payload after the labels moved on,
            # so the live labels decide whether the requested round still
            # stands; a consumed lane label stops the summon without a failure.
            - id: live
              name: Verify the lane label is live
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -o pipefail
                  labels=$(gh api --paginate "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/labels?per_page=100" \
                      --jq '[.[].name]' | jq -s 'add // []')
                  if jq -e 'index("review:cursor") != null' <<<"$labels" >/dev/null; then
                      echo "live=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "live=false" >> "$GITHUB_OUTPUT"
                      echo "no live review:cursor label on this pull request; the summon stands down."
                  fi

            - name: Dispatch Bugbot and consume the request
              if: steps.live.outputs.live == 'true'
              env:
                  GH_TOKEN: ${{ github.token }}
                  # Cursor drops bot-authored trigger comments; only the
                  # owner-minted token can voice a summon Cursor acts on.
                  SUMMON_TOKEN: ${{ secrets.RUNEWRIGHT_GITHUB_TOKEN }}
                  REPO: ${{ github.repository }}
                  PR: ${{ github.event.pull_request.number }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
              run: |
                  set -o pipefail
                  fail_request() {
                      echo "::error::$1 The review:cursor request remains available for retry."
                      exit 1
                  }
                  head_still() {
                      live=$(gh api "repos/$REPO/pulls/$PR" --jq '.head.sha') \
                          || fail_request "Cannot read the current pull request head."
                      [ "$live" = "$HEAD_SHA" ] \
                          || fail_request "The head changed from $HEAD_SHA to $live. Request Bugbot on the final head."
                  }
                  if [ -z "$SUMMON_TOKEN" ]; then
                      fail_request "RUNEWRIGHT_GITHUB_TOKEN is empty. Configure the optional owner-authored Bugbot summon."
                  fi
                  head_still
                  labels=$(gh api --paginate "repos/$REPO/issues/$PR/labels?per_page=100" \
                      --jq '[.[].name]' | jq -s 'add // []') \
                      || fail_request "Cannot verify the live Bugbot request."
                  if ! jq -e 'index("review:cursor") != null' <<<"$labels" >/dev/null; then
                      echo "The review:cursor request was withdrawn. Bugbot will not be dispatched."
                      exit 0
                  fi
                  if ! dispatch=$(GH_TOKEN=$SUMMON_TOKEN gh api -X POST \
                      "repos/$REPO/issues/$PR/comments" -f body="$SUMMON_COMMENT" --jq '.id' 2>&1); then
                      case "$dispatch" in
                          *"HTTP 401"*) fail_request "GitHub rejected RUNEWRIGHT_GITHUB_TOKEN authentication (HTTP 401). The owner must replace invalid or expired credentials." ;;
                          *"HTTP 403"*) fail_request "GitHub denied the Bugbot summon (HTTP 403). The owner must inspect token access, installation policy, and response details." ;;
                          *) fail_request "GitHub did not confirm the Bugbot summon. Inspect the existing comments before retrying an uncertain dispatch." ;;
                      esac
                  fi
                  echo "Bugbot summon comment: $dispatch. Dispatch does not prove a completed review."
                  head_still
                  # Workflow-token writes emit no new workflow event.
                  # An App-token fallback could cancel this run through an unlabeled event.
                  if ! consumed=$(gh api -X DELETE "repos/$REPO/issues/$PR/labels/review%3Acursor" 2>&1); then
                      case "$consumed" in
                          *"HTTP 404"*) exit 0 ;;
                      esac
                      fail_request "The summon succeeded, but GitHub denied request consumption. Inspect caller token permissions before retrying."
                  fi
