name: Thread Resolver

# Retired body, kept so existing callers stay green. Thread resolution
# has one path now: the correctness lane's resolve step, which acts on
# the ledger the round just recorded, with the reviewer identity, on the
# head the verdict judged. A separate resolver read the newest ledger
# artifact on the next push and raced the controller run for that push,
# so it acted on the previous head's verdict or on none. A Resolves-Thread:
# trailer on a fix commit stays bookkeeping for the verdict; it resolves
# nothing by itself. Callers can drop their stub at any time.
on:
    workflow_call:
        secrets:
            RUNESEER_APP_ID:
                required: false
            RUNESEER_APP_KEY:
                required: false

jobs:
    resolve:
        name: resolve
        runs-on: ubuntu-latest
        timeout-minutes: 1
        steps:
            - run: |
                  echo "thread resolution moved into the review/correctness round; this caller can drop its thread-resolver stub."
