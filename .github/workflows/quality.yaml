name: Quality

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

concurrency:
    group: quality-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    quality:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  persist-credentials: false

            - name: Shellcheck scripts
              run: |
                  sudo apt-get install -y shellcheck
                  shellcheck -S warning .github/scripts/*.sh

            # Third-party actions must be pinned to a full commit SHA;
            # first-party paths (./) and runedeck/* refs are exempt.
            # Comments are stripped before the SHA test so trailing text
            # cannot fake a pin.
            - name: Action pinning
              run: |
                  violations=$(grep -RnE '^[[:space:]]*-?[[:space:]]*uses:[[:space:]]*["'\'']?[^./[:space:]"'\'']' .github/workflows 2>/dev/null \
                      | sed 's/[[:space:]]#.*$//' \
                      | grep -vE 'uses:[[:space:]]*["'\'']?(\./|runedeck/)' \
                      | grep -vE '@[0-9a-f]{40}["'\'']?$' || true)
                  if [ -n "$violations" ]; then
                      echo "Unpinned third-party actions:"
                      printf '%s\n' "$violations"
                      exit 1
                  fi
                  echo "All third-party actions pinned."
