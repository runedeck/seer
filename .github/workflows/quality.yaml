name: Quality

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

concurrency:
    group: quality-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    quality:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  persist-credentials: false

            # Third-party actions must be pinned to a full commit SHA;
            # first-party paths (./) and runedeck/* refs are exempt.
            # Comments are stripped before the SHA test so trailing text
            # cannot fake a pin.
            - name: Action pinning
              run: |
                  violations=$(grep -RnE '^[[:space:]]*-?[[:space:]]*uses:[[:space:]]*["'\'']?[^./[:space:]"'\'']' .github/workflows 2>/dev/null \
                      | sed 's/[[:space:]]#.*$//' \
                      | grep -vE 'uses:[[:space:]]*["'\'']?(\./|runedeck/)' \
                      | grep -vE '@[0-9a-f]{40}["'\'']?$' || true)
                  if [ -n "$violations" ]; then
                      echo "Unpinned third-party actions:"
                      printf '%s\n' "$violations"
                      exit 1
                  fi
                  echo "All third-party actions pinned."

            - name: Shellcheck scripts
              run: |
                  sudo apt-get install -y shellcheck
                  shellcheck -S warning .github/scripts/*.sh

            - name: Test review summary formatter
              run: python3 .github/scripts/test_runeseer_summary.py

            - name: Actionlint workflows
              run: |
                  curl -fsSLO https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
                  printf '%s  %s\n' \
                      023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757 \
                      actionlint_1.7.7_linux_amd64.tar.gz | sha256sum --check
                  tar -xzf actionlint_1.7.7_linux_amd64.tar.gz actionlint
                  ./actionlint \
                      -ignore 'property "workflow_sha" is not defined in object type' \
                      -ignore 'SC2016'
